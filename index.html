<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#0b0f1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:-0.02em}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}

:root{
–bg:#0b0f1a;–bgc:#131a2b;–bgc2:#1a2236;–bgi:#0f1525;
–brd:#1e293b;–acc:#10b981;–acc2:#34d399;–accd:#059669;–accbg:rgba(16,185,129,.08);
–red:#ef4444;–redbg:rgba(239,68,68,.08);–org:#f59e0b;–blu:#3b82f6;–pur:#8b5cf6;–cyn:#06b6d4;
–t1:#e2e8f0;–t2:#94a3b8;–t3:#64748b;
–sw:260px;–rad:12px;–rs:8px;
}

#root{display:flex;min-height:100vh;width:100%}

/* SIDEBAR */
.sb{position:fixed;left:0;top:0;bottom:0;width:var(–sw);background:#0d1220;border-right:1px solid var(–brd);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sb-brand{padding:24px 22px 18px;display:flex;align-items:center;gap:12px}
.sb-logo{width:38px;height:38px;background:linear-gradient(135deg,var(–acc),var(–cyn));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;font-family:‘Outfit’,sans-serif}
.sb-brand h1{font-size:1.25rem;color:#fff;font-weight:700}
.sb-brand h1 span{color:var(–acc)}
.sb-nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:var(–rs);color:var(–t2);font-size:.9rem;font-weight:500;transition:all .2s;background:transparent;width:100%;text-align:left}
.nv:hover{background:var(–bgc);color:var(–t1)}
.nv.act{background:var(–accbg);color:var(–acc)}
.nv svg{width:20px;height:20px;flex-shrink:0}
.sb-ft{padding:14px 20px;border-top:1px solid var(–brd);font-size:.72rem;color:var(–t3);text-align:center}

/* MAIN */
.main{margin-left:var(–sw);flex:1;min-height:100vh;width:calc(100% - var(–sw))}
.pg{padding:28px 36px;max-width:1600px;width:100%}
.pg-hd{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.pg-hd h2{font-size:1.55rem;color:#fff}
.pg-hd p{color:var(–t2);font-size:.85rem;margin-top:2px}

/* CARDS */
.cd{background:var(–bgc);border:1px solid var(–brd);border-radius:var(–rad);padding:22px;transition:border-color .2s}
.cd:hover{border-color:#2d3748}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:24px}
.st .lb{font-size:.8rem;color:var(–t2);margin-bottom:8px}
.st .vl{font-size:1.45rem;font-weight:700;font-family:‘Outfit’,sans-serif;color:#fff}
.st .sub{font-size:.78rem;color:var(–t3);margin-top:4px}
.si{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(–rs);font-size:.86rem;font-weight:600;transition:all .2s}
.bp{background:var(–acc);color:#fff}.bp:hover{background:var(–accd);transform:translateY(-1px)}
.bs{background:var(–bgc);color:var(–t1);border:1px solid var(–brd)}.bs:hover{border-color:var(–t3)}
.bd{background:var(–redbg);color:var(–red)}.bd:hover{background:rgba(239,68,68,.15)}
.bi{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(–rs);background:transparent;color:var(–t2);transition:all .15s;border:none}
.bi:hover{background:var(–bgc);color:var(–t1)}

/* FORMS */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:.78rem;font-weight:600;color:var(–t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fi{width:100%;padding:10px 13px;background:var(–bgi);border:1px solid var(–brd);border-radius:var(–rs);color:var(–t1);font-size:.9rem;transition:border-color .2s}
.fi:focus{border-color:var(–acc);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.fi::placeholder{color:var(–t3)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.moc{background:var(–bgc);border:1px solid var(–brd);border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;animation:slideUp .25s}
.moh{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between}
.moh h3{font-size:1.1rem;color:#fff}
.mob{padding:18px 22px}
.mof{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:.76rem;font-weight:600;color:var(–t3);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(–brd)}
tbody td{padding:13px 14px;border-bottom:1px solid var(–brd);font-size:.88rem}
tbody tr:hover{background:var(–bgc2)}
tbody tr:last-child td{border-bottom:none}

/* WALLET */
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.wc{position:relative;overflow:hidden}
.wc-nm{font-size:.95rem;font-weight:600;color:#fff;margin-bottom:2px}
.wc-bl{font-size:1.5rem;font-weight:700;font-family:‘Outfit’,sans-serif;color:#fff;margin-top:10px}
.wc-act{display:flex;gap:4px;position:absolute;top:14px;right:14px}

/* CATEGORY */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}
.cc{display:flex;align-items:center;gap:11px;padding:13px 14px}
.cc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cc-nm{font-size:.9rem;font-weight:500;flex:1}
.cc-act{display:flex;gap:2px}

/* TXN */
.txi{color:var(–acc)}.txe{color:var(–red)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:16px;font-size:.76rem;font-weight:500}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(–t3)}
.empty .ei{font-size:42px;margin-bottom:14px;opacity:.5}
.empty h3{color:var(–t2);margin-bottom:6px;font-size:1rem}
.empty p{font-size:.84rem;max-width:280px;margin:0 auto}

/* TABS */
.tabs{display:flex;gap:3px;background:var(–bgi);border-radius:var(–rs);padding:3px;width:fit-content}
.tab{padding:7px 18px;border-radius:6px;font-size:.83rem;font-weight:600;color:var(–t3);background:transparent;transition:all .2s}
.tab.act{background:var(–bgc);color:var(–acc);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* TOAST */
.tc{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(–rs);font-size:.86rem;font-weight:500;animation:slideUp .3s;display:flex;align-items:center;gap:9px}
.tok{background:#065f46;color:#a7f3d0;border:1px solid #10b981}
.terr{background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444}

/* BUDGET BAR */
.bbg{width:100%;height:7px;background:var(–bgi);border-radius:4px;overflow:hidden;margin-top:8px}
.bfill{height:100%;border-radius:4px;transition:width .5s}

/* COLOR PICKER */
.clr{display:flex;gap:7px;flex-wrap:wrap}
.co{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.co.sel{border-color:#fff;transform:scale(1.15)}

/* FILTER */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.fbar .fi{max-width:180px}

/* DASH GRID */
.dg{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

/* MOBILE */
.mh{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:#0d1220;border-bottom:1px solid var(–brd);z-index:100;padding:0 14px;align-items:center;justify-content:space-between}
.mn{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:#0d1220;border-top:1px solid var(–brd);z-index:100;padding:0 4px;align-items:center;justify-content:space-around}
.mni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.65rem;color:var(–t3);padding:5px 10px;border-radius:8px;background:transparent;transition:color .2s;border:none}
.mni.act{color:var(–acc)}
.mni svg{width:21px;height:21px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
.sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}
.mh,.mn{display:flex}
.main{margin-left:0;padding-bottom:76px;padding-top:54px}
.pg{padding:16px 14px}
.sg{grid-template-columns:repeat(2,1fr);gap:8px}
.st .vl{font-size:1.15rem}
.fr{grid-template-columns:1fr}
.wg{grid-template-columns:1fr}
.cg{grid-template-columns:1fr}
.pg-hd h2{font-size:1.2rem}
.fbar .fi{max-width:100%;flex:1}
.dg{grid-template-columns:1fr}
}

/* LOADING */
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;color:var(–acc);font-weight:600}
.loading-screen div{text-align:center}
.loading-screen .icon{font-size:2.5rem;margin-bottom:14px}
</style>

</head>

/* ═══ HELPERS ═══ */
var COLORS = ['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316','#14b8a6','#6366f1','#84cc16','#e11d48'];

}

/* ═══ TOAST ═══ */
var ToastCtx = createContext();
function ToastProvider(props) {
  var _s = useState([]);
  var ts = _s[0], setTs = _s[1];
  var add = useCallback(function(m, t) {
    var typ = t || 'ok';
    var id = Date.now();
    setTs(function(p) { return p.concat([{id:id,m:m,t:typ}]); });
    setTimeout(function() { setTs(function(p) { return p.filter(function(x) { return x.id !== id; }); }); }, 3000);
  }, []);
  return (
    <ToastCtx.Provider value={add}>
      {props.children}
      <div className="tc">
        {ts.map(function(t) {
          return <div key={t.id} className={'toast ' + (t.t === 'ok' ? 'tok' : 'terr')}>{t.t === 'ok' ? '✓' : '✗'} {t.m}</div>;
        })}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast() { return useContext(ToastCtx); }

/* ═══ MODAL ═══ */
function Modal(props) {
  if (!props.open) return null;
  return (
    <div className="mo" onClick={props.onClose}>
      <div className="moc" onClick={function(e) { e.stopPropagation(); }}>
        <div className="moh">
          <h3>{props.title}</h3>
          <button className="bi" onClick={props.onClose}><Ico name="x"/></button>
        </div>
        <div className="mob">{props.children}</div>
        {props.footer && <div className="mof">{props.footer}</div>}
      </div>
    </div>
  );
}

/* ═══ CONFIRM ═══ */
function useConfirm() {
  var _s = useState(null);
  var s = _s[0], setS = _s[1];
  var confirm = useCallback(function(msg) {
    return new Promise(function(resolve) {
      setS({msg: msg, resolve: resolve});
    });
  }, []);
  var el = null;
  if (s) {
    el = (
      <div className="mo" onClick={function() { s.resolve(false); setS(null); }}>

          </div>
        </div>
      </div>
    );
  }
  return [confirm, el];
}

function App() {
  var _page = useState('dashboard'), page = _page[0], setPage = _page[1];
  var _mob = useState(false), mob = _mob[0], setMob = _mob[1];
  var _w = useState([]), wallets = _w[0], setW = _w[1];
  var _t = useState([]), transactions = _t[0], setT = _t[1];
  var _c = useState([]), categories = _c[0], setC = _c[1];

  var rB = function() { sb.from('budgets').select('*').order('created_at').then(function(r) { if(r.data) setB(r.data); }); };

  var ctx = {wallets:wallets, transactions:transactions, categories:categories, budgets:budgets, investments:investments, rW:rW, rT:rT, rC:rC, rB:rB, rI:rI};

    {id:'investments', label:'Investasi', icon:'invest'},

        <h1 style={{fontFamily:'Outfit',fontSize:'1.05rem',fontWeight:700,color:'#fff'}}>Wealth<span style={{color:'var(--acc)'}}>Flow</span></h1>
        <div style={{width:34}}/>
      </div>
      {mob && <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',zIndex:99}} onClick={function() { setMob(false); }}/>}

      {/* MOBILE NAV */}
      <div className="mn">
        {nav.slice(0,5).map(function(n) {
          return <button key={n.id} className={'mni' + (page === n.id ? ' act' : '')} onClick={function() { go(n.id); }}><Ico name={n.icon}/><span>{n.label}</span></button>;

      {/* CONTENT */}

          <strong>DB Notice:</strong> {dbErr}

        {page === 'dashboard' && <Dashboard {...ctx}/>}
        {page === 'wallets' && <WalletsPage {...ctx}/>}
        {page === 'transactions' && <TransactionsPage {...ctx}/>}
        {page === 'categories' && <CategoriesPage {...ctx}/>}
        {page === 'budgets' && <BudgetsPage {...ctx}/>}
        {page === 'investments' && <InvestmentsPage {...ctx}/>}
      </div></main>
    </Fragment>
  );
}

/* ══════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════ */
function Dashboard(props) {
  var wallets = props.wallets, transactions = props.transactions, categories = props.categories, budgets = props.budgets, investments = props.investments;
  var totalBal = wallets.reduce(function(s,w) { return s + (Number(w.balance)||0); }, 0);
  var now = new Date();
  var mo = transactions.filter(function(t) { var d = new Date(t.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  var inc = mo.filter(function(t) { return t.type === 'income'; }).reduce(function(s,t) { return s + (Number(t.amount)||0); }, 0);
  var exp = mo.filter(function(t) { return t.type === 'expense'; }).reduce(function(s,t) { return s + (Number(t.amount)||0); }, 0);
  var invTot = investments.reduce(function(s,i) { return s + (Number(i.current_value) || Number(i.amount) || 0); }, 0);
  var recent = transactions.slice(0, 8);

  return (
    <Fragment>
      <div className="pg-hd"><div><h2>Dashboard</h2><p>Ringkasan keuangan Anda</p></div></div>
      <div className="sg">
        <div className="cd st"><div className="si" style={{background:'var(--accbg)',color:'var(--acc)'}}>💰</div><div className="lb">Total Saldo</div><div className="vl">{fmtIDR(totalBal)}</div><div className="sub">{wallets.length} dompet</div></div>
        <div className="cd st"><div className="si" style={{background:'var(--accbg)',color:'var(--acc)'}}>📈</div><div className="lb">Pemasukan Bulan Ini</div><div className="vl" style={{color:'var(--acc)'}}>{fmtIDR(inc)}</div></div>
        <div className="cd st"><div className="si" style={{background:'var(--redbg)',color:'var(--red)'}}>📉</div><div className="lb">Pengeluaran Bulan Ini</div><div className="vl" style={{color:'var(--red)'}}>{fmtIDR(exp)}</div></div>
        <div className="cd st"><div className="si" style={{background:'rgba(59,130,246,.08)',color:'var(--blu)'}}>📊</div><div className="lb">Investasi</div><div className="vl" style={{color:'var(--blu)'}}>{fmtIDR(invTot)}</div><div className="sub">{investments.length} aset</div></div>
      </div>

      <div className="dg">
        <div className="cd">
          <h3 style={{fontSize:'1rem',marginBottom:14,color:'#fff'}}>Transaksi Terakhir</h3>
          {recent.length === 0 ? <div className="empty"><div className="ei">📋</div><p>Belum ada transaksi</p></div> :
          <div>{recent.map(function(t) {
            return (
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:'1px solid var(--brd)'}}>
                <div style={{width:34,height:34,borderRadius:8,background:t.type==='income'?'var(--accbg)':'var(--redbg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>
                  {t.type === 'income' ? '↗' : '↘'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'.84rem',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t.description || getCatName(categories, t.category_id)}</div>
                  <div style={{fontSize:'.72rem',color:'var(--t3)'}}>{fmtDate(t.date)} · {getWalletName(wallets, t.wallet_id)}</div>
                </div>
                <div className={t.type === 'income' ? 'txi' : 'txe'} style={{fontWeight:600,fontFamily:'Outfit',fontSize:'.88rem'}}>
                  {t.type === 'income' ? '+' : '-'}{fmtIDR(t.amount)}
                </div>
              </div>
            );
          })}</div>}
        </div>

        <div className="cd">
          <h3 style={{fontSize:'1rem',marginBottom:14,color:'#fff'}}>Dompet</h3>
          {wallets.length === 0 ? <div className="empty"><div className="ei">👛</div><p>Belum ada dompet</p></div> :
          <div>{wallets.map(function(w) {
            return (
              <div key={w.id} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:'1px solid var(--brd)'}}>
                <div style={{width:34,height:34,borderRadius:8,background:w.color||'var(--acc)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,color:'#fff',fontWeight:700,fontFamily:'Outfit'}}>{(w.name||'W')[0].toUpperCase()}</div>
                <div style={{flex:1}}><div style={{fontSize:'.86rem',fontWeight:500}}>{w.name}</div></div>
                <div style={{fontWeight:600,fontFamily:'Outfit',fontSize:'.88rem'}}>{fmtIDR(w.balance)}</div>
              </div>
            );
          })}</div>}

          {budgets.length > 0 && (
            <Fragment>
              <h3 style={{fontSize:'1rem',marginBottom:12,marginTop:22,color:'#fff'}}>Anggaran</h3>
              {budgets.map(function(b) {
                var sp = transactions.filter(function(t) { return t.type==='expense' && t.category_id===b.category_id; }).reduce(function(s,t) { return s+(Number(t.amount)||0); }, 0);
                var pct = b.amount > 0 ? Math.min((sp / b.amount) * 100, 100) : 0;
                var nm = getCatName(categories, b.category_id);
                return (
                  <div key={b.id} style={{marginBottom:10}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:'.8rem'}}><span style={{fontWeight:500}}>{nm}</span><span style={{color:'var(--t3)'}}>{fmtIDR(sp)} / {fmtIDR(b.amount)}</span></div>
                    <div className="bbg"><div className="bfill" style={{width:pct+'%',background:pct>90?'var(--red)':pct>70?'var(--org)':'var(--acc)'}}/></div>
                  </div>
                );
              })}
            </Fragment>
          )}
        </div>
      </div>
    </Fragment>
  );
}

/* ══════════════════════════════════════════
   TRANSACTIONS
══════════════════════════════════════════ */
function TransactionsPage(props) {
  var wallets=props.wallets, transactions=props.transactions, categories=props.categories, rT=props.rT, rW=props.rW;
  var toast = useToast();
  var _m=useState(null), modal=_m[0], setM=_m[1];
  var _c=useConfirm(), confirm=_c[0], cEl=_c[1];
  var _f=useState({type:'expense',wallet_id:'',category_id:'',amount:'',description:'',date:getToday()}), f=_f[0], setF=_f[1];
  var _ft=useState('all'), fType=_ft[0], setFT=_ft[1];
  var _fw=useState('all'), fWal=_fw[0], setFW=_fw[1];
  var _s=useState(''), search=_s[0], setSrch=_s[1];

  var list = useMemo(function() {
    var l = transactions.slice();
    if (fType !== 'all') l = l.filter(function(t){return t.type===fType;});
    if (fWal !== 'all') l = l.filter(function(t){return t.wallet_id===fWal;});
    if (search.trim()) {
      var q = search.toLowerCase();
      l = l.filter(function(t){return (t.description||'').toLowerCase().indexOf(q)>=0 || getCatName(categories,t.category_id).toLowerCase().indexOf(q)>=0;});
    }
    return l;
  }, [transactions, fType, fWal, search, categories]);

  function openA() { setF({type:'expense',wallet_id:wallets.length>0?wallets[0].id:'',category_id:'',amount:'',description:'',date:getToday()}); setM({mode:'add'}); }
  function openE(t) { setF({type:t.type,wallet_id:t.wallet_id||'',category_id:t.category_id||'',amount:String(t.amount||0),description:t.description||'',date:t.date||getToday()}); setM({mode:'edit',d:t}); }

  function save() {
    if (!f.amount || Number(f.amount) <= 0) { toast('Jumlah harus > 0','err'); return; }
    var p = {type:f.type,wallet_id:f.wallet_id||null,category_id:f.category_id||null,amount:Number(f.amount),description:f.description.trim(),date:f.date};
    if (modal.mode === 'add') {
      sb.from('transactions').insert(p).then(function(r) {
        if (r.error) { toast(r.error.message,'err'); return; }
        if (f.wallet_id) {
          var w = findById(wallets, f.wallet_id);
          if (w) {
            var nb = f.type==='income' ? (Number(w.balance)||0)+Number(f.amount) : (Number(w.balance)||0)-Number(f.amount);
            sb.from('wallets').update({balance:nb}).eq('id',f.wallet_id).then(function(){rW();});
          }
        }
        toast('Transaksi ditambahkan'); setM(null); rT();
      });
    } else {
      sb.from('transactions').update(p).eq('id',modal.d.id).then(function(r) {
        if (r.error) { toast(r.error.message,'err'); return; }
        toast('Transaksi diperbarui'); setM(null); rT(); rW();
      });
    }
  }

  function del(t) {
    confirm('Hapus transaksi "' + (t.description || fmtIDR(t.amount)) + '"?').then(function(ok) {
      if (!ok) return;
      sb.from('transactions').delete().eq('id',t.id).then(function(r) {
        if (r.error) { toast(r.error.message,'err'); return; }
        if (t.wallet_id) {
          var w = findById(wallets, t.wallet_id);
          if (w) {
            var nb = t.type==='income' ? (Number(w.balance)||0)-Number(t.amount) : (Number(w.balance)||0)+Number(t.amount);
            sb.from('wallets').update({balance:nb}).eq('id',t.wallet_id).then(function(){rW();});
          }
        }
        toast('Transaksi dihapus'); rT();
      });
    });
  }

  var relCats = categories.filter(function(c){return c.type===f.type;});

  function uf(key, val) { var n = {}; for(var k in f) n[k]=f[k]; n[key]=val; if(key==='type') n.category_id=''; setF(n); }

  return (
    <Fragment>
      <div className="pg-hd"><div><h2>Transaksi</h2><p>Catatan pemasukan &amp; pengeluaran</p></div><button className="btn bp" onClick={openA}><Ico name="plus"/> Tambah</button></div>
      <div className="fbar">
        <input className="fi" placeholder="Cari..." value={search} onChange={function(e){setSrch(e.target.value);}} style={{maxWidth:200}}/>
        <select className="fi" value={fType} onChange={function(e){setFT(e.target.value);}} style={{maxWidth:150}}><option value="all">Semua Tipe</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select>
        <select className="fi" value={fWal} onChange={function(e){setFW(e.target.value);}} style={{maxWidth:160}}><option value="all">Semua Dompet</option>{wallets.map(function(w){return <option key={w.id} value={w.id}>{w.name}</option>;})}</select>
      </div>

      <div className="cd">
        {list.length === 0 ? <div className="empty"><div className="ei">📋</div><h3>Tidak Ada Transaksi</h3><p>Mulai catat pemasukan dan pengeluaran</p></div> :
        <div className="tw"><table>
          <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Dompet</th><th style={{textAlign:'right'}}>Jumlah</th><th></th></tr></thead>
          <tbody>{list.map(function(t) {
            return (
              <tr key={t.id}>
                <td style={{color:'var(--t3)',fontSize:'.82rem',whiteSpace:'nowrap'}}>{fmtDate(t.date)}</td>
                <td style={{fontWeight:500,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description || '-'}</td>
                <td><span className="badge" style={{background:t.type==='income'?'var(--accbg)':'var(--redbg)',color:t.type==='income'?'var(--acc)':'var(--red)'}}><span style={{width:6,height:6,borderRadius:'50%',background:getCatColor(categories,t.category_id),display:'inline-block'}}/>{getCatName(categories, t.category_id)}</span></td>
                <td style={{color:'var(--t2)',fontSize:'.84rem'}}>{getWalletName(wallets, t.wallet_id)}</td>
                <td className={t.type==='income'?'txi':'txe'} style={{textAlign:'right',fontWeight:600,fontFamily:'Outfit',fontSize:'.88rem'}}>{t.type==='income'?'+':'-'}{fmtIDR(t.amount)}</td>
                <td style={{whiteSpace:'nowrap'}}><button className="bi" onClick={function(){openE(t);}}><Ico name="edit"/></button><button className="bi" onClick={function(){del(t);}} style={{color:'var(--red)'}}><Ico name="trash"/></button></td>
              </tr>
            );
          })}</tbody>
        </table></div>}
      </div>

      <Modal open={!!modal} onClose={function(){setM(null);}} title={modal && modal.mode==='add'?'Tambah Transaksi':'Edit Transaksi'} footer={
        <Fragment><button className="btn bs" onClick={function(){setM(null);}}>Batal</button><button className="btn bp" onClick={save}>{modal && modal.mode==='add'?'Tambah':'Simpan'}</button></Fragment>
      }>
        <div className="fg"><label>Tipe</label><div className="tabs"><button className={'tab'+(f.type==='expense'?' act':'')} onClick={function(){uf('type','expense');}}>Pengeluaran</button><button className={'tab'+(f.type==='income'?' act':'')} onClick={function(){uf('type','income');}}>Pemasukan</button></div></div>
        <div className="fr">
          <div className="fg"><label>Jumlah (Rp)</label><input className="fi" type="number" placeholder="0" value={f.amount} onChange={function(e){uf('amount',e.target.value);}}/></div>
          <div className="fg"><label>Tanggal</label><input className="fi" type="date" value={f.date} onChange={function(e){uf('date',e.target.value);}}/></div>
        </div>
        <div className="fr">
          <div className="fg"><label>Dompet</label><select className="fi" value={f.wallet_id} onChange={function(e){uf('wallet_id',e.target.value);}}><option value="">Pilih dompet</option>{wallets.map(function(w){return <option key={w.id} value={w.id}>{w.name}</option>;})}</select></div>
          <div className="fg"><label>Kategori</label><select className="fi" value={f.category_id} onChange={function(e){uf('category_id',e.target.value);}}><option value="">Pilih kategori</option>{relCats.map(function(c){return <option key={c.id} value={c.id}>{c.name}</option>;})}</select></div>
        </div>
        <div className="fg"><label>Keterangan</label><input className="fi" placeholder="Deskripsi transaksi..." value={f.description} onChange={function(e){uf('description',e.target.value);}}/></div>
      </Modal>
      {cEl}
    </Fragment>
  );
}

function BudgetsPage(props) {
var budgets=props.budgets, categories=props.categories, transactions=props.transactions, rB=props.rB;
var toast=useToast();
var _m=useState(null), modal=_m[0], setM=_m[1];
var _c=useConfirm(), confirm=_c[0], cEl=_c[1];
var _f=useState({category_id:’’,amount:’’,period:‘monthly’}), f=_f[0], setF=_f[1];
var expC = categories.filter(function(c){return c.type===‘expense’;});

function openA() { setF({category_id:expC.length>0?expC[0].id:’’,amount:’’,period:‘monthly’}); setM({mode:‘add’}); }
function openE(b) { setF({category_id:b.category_id||’’,amount:String(b.amount||0),period:b.period||‘monthly’}); setM({mode:‘edit’,d:b}); }
function uf(key,val) { var n={category_id:f.category_id,amount:f.amount,period:f.period}; n[key]=val; setF(n); }

function save() {
if (!f.amount||Number(f.amount)<=0) { toast(‘Jumlah harus > 0’,‘err’); return; }
var p = {category_id:f.category_id||null, amount:Number(f.amount), period:f.period};
if (modal.mode===‘add’) {
sb.from(‘budgets’).insert(p).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Anggaran ditambahkan’);setM(null);rB();});
} else {
sb.from(‘budgets’).update(p).eq(‘id’,modal.d.id).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Anggaran diperbarui’);setM(null);rB();});
}
}

function del(b) {
var nm = getCatName(categories, b.category_id);
confirm(‘Hapus anggaran untuk “’+nm+’”?’).then(function(ok) {
if (!ok) return;
sb.from(‘budgets’).delete().eq(‘id’,b.id).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Anggaran dihapus’);rB();});
});
}

return (
<Fragment>
<div className="pg-hd"><div><h2>Anggaran</h2><p>Atur batas pengeluaran per kategori</p></div><button className="btn bp" onClick={openA}><Ico name="plus"/> Tambah</button></div>
{budgets.length===0 ? <div className="cd"><div className="empty"><div className="ei">📊</div><h3>Belum Ada Anggaran</h3><p>Tetapkan batas pengeluaran</p></div></div> :
<div style={{display:‘grid’,gridTemplateColumns:‘repeat(auto-fill,minmax(320px,1fr))’,gap:14}}>
{budgets.map(function(b) {
var cat = findById(categories, b.category_id);
var nm = cat ? cat.name : ‘-’;
var cl = cat ? (cat.color || ‘var(–acc)’) : ‘var(–acc)’;
var sp = transactions.filter(function(t){return t.type===‘expense’&&t.category_id===b.category_id;}).reduce(function(s,t){return s+(Number(t.amount)||0);},0);
var pct = b.amount>0 ? Math.min((sp/b.amount)*100,100) : 0;
var ov = sp > b.amount;
return (
<div key={b.id} className="cd">
<div style={{display:‘flex’,justifyContent:‘space-between’,alignItems:‘flex-start’}}>
<div><div style={{display:‘flex’,alignItems:‘center’,gap:8,marginBottom:4}}><span style={{width:10,height:10,borderRadius:‘50%’,background:cl}}/><span style={{fontWeight:600,fontSize:’.95rem’}}>{nm}</span></div><div style={{fontSize:’.76rem’,color:‘var(–t3)’,textTransform:‘capitalize’}}>{b.period||‘monthly’}</div></div>
<div style={{display:‘flex’,gap:4}}><button className="bi" style={{width:30,height:30}} onClick={function(){openE(b);}}><Ico name="edit"/></button><button className=“bi” style={{width:30,height:30,color:‘var(–red)’}} onClick={function(){del(b);}}><Ico name="trash"/></button></div>
</div>
<div style={{marginTop:12,display:‘flex’,justifyContent:‘space-between’,alignItems:‘baseline’}}><span style={{fontFamily:‘Outfit’,fontWeight:700,fontSize:‘1.15rem’,color:ov?‘var(–red)’:’#fff’}}>{fmtIDR(sp)}</span><span style={{fontSize:’.8rem’,color:‘var(–t3)’}}>dari {fmtIDR(b.amount)}</span></div>
<div className="bbg"><div className=“bfill” style={{width:pct+’%’,background:ov?‘var(–red)’:pct>70?‘var(–org)’:cl}}/></div>
<div style={{textAlign:‘right’,fontSize:’.73rem’,color:ov?‘var(–red)’:‘var(–t3)’,marginTop:4}}>{Math.round(pct)}%{ov?’ — Over budget!’:’’}</div>
</div>
);
})}
</div>}

function InvestmentsPage(props) {
var investments=props.investments, rI=props.rI;
var toast=useToast();
var _m=useState(null), modal=_m[0], setM=_m[1];
var _c=useConfirm(), confirm=_c[0], cEl=_c[1];
var _f=useState({name:’’,type:‘stock’,amount:’’,current_value:’’,purchase_date:getToday()}), f=_f[0], setF=_f[1];

function openA() { setF({name:’’,type:‘stock’,amount:’’,current_value:’’,purchase_date:getToday()}); setM({mode:‘add’}); }
function openE(i) { setF({name:i.name||’’,type:i.type||‘stock’,amount:String(i.amount||0),current_value:String(i.current_value||0),purchase_date:i.purchase_date||getToday()}); setM({mode:‘edit’,d:i}); }
function uf(key,val) { var n={name:f.name,type:f.type,amount:f.amount,current_value:f.current_value,purchase_date:f.purchase_date}; n[key]=val; setF(n); }

function save() {
if (!f.name.trim()) { toast(‘Nama wajib diisi’,‘err’); return; }
var p = {name:f.name.trim(),type:f.type,amount:Number(f.amount)||0,current_value:Number(f.current_value)||0,purchase_date:f.purchase_date};
if (modal.mode===‘add’) {
sb.from(‘investments’).insert(p).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Investasi ditambahkan’);setM(null);rI();});
} else {
sb.from(‘investments’).update(p).eq(‘id’,modal.d.id).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Investasi diperbarui’);setM(null);rI();});
}
}

function del(inv) {
confirm(‘Hapus investasi “’+inv.name+’”?’).then(function(ok) {
if (!ok) return;
sb.from(‘investments’).delete().eq(‘id’,inv.id).then(function(r){if(r.error){toast(r.error.message,‘err’);return;}toast(‘Investasi dihapus’);rI();});
});
}

var tI = investments.reduce(function(s,i){return s+(Number(i.amount)||0);},0);
var tC = investments.reduce(function(s,i){return s+(Number(i.current_value)||Number(i.amount)||0);},0);
var tGL = tC - tI;
var typeLabel = {stock:‘Saham’,crypto:‘Crypto’,mutual_fund:‘Reksa Dana’,bond:‘Obligasi’,gold:‘Emas’,property:‘Properti’,other:‘Lainnya’};

return (
<Fragment>
<div className="pg-hd"><div><h2>Investasi</h2><p>Pantau portofolio investasi Anda</p></div><button className="btn bp" onClick={openA}><Ico name="plus"/> Tambah</button></div>
<div className="sg">
<div className="cd st"><div className="lb">Total Investasi</div><div className="vl">{fmtIDR(tI)}</div></div>
<div className="cd st"><div className="lb">Nilai Saat Ini</div><div className=“vl” style={{color:‘var(–blu)’}}>{fmtIDR(tC)}</div></div>
<div className="cd st"><div className="lb">Gain/Loss</div><div className="vl" style={{color:tGL>=0?‘var(–acc)’:‘var(–red)’}}>{tGL>=0?’+’:’’}{fmtIDR(tGL)}</div>{tI>0 && <div className="sub">{tGL>=0?’+’:’’}{((tGL/tI)*100).toFixed(1)}%</div>}</div>
</div>

```
  {investments.length===0 ? <div className="cd"><div className="empty"><div className="ei">📈</div><h3>Belum Ada Investasi</h3><p>Mulai catat portofolio Anda</p></div></div> :
  <div className="cd"><div className="tw"><table>
    <thead><tr><th>Nama</th><th>Tipe</th><th style={{textAlign:'right'}}>Modal</th><th style={{textAlign:'right'}}>Nilai Saat Ini</th><th style={{textAlign:'right'}}>G/L</th><th>Tanggal</th><th></th></tr></thead>
    <tbody>{investments.map(function(inv) {
      var gl = (Number(inv.current_value)||0) - (Number(inv.amount)||0);

          <td style={{textAlign:'right',fontFamily:'Outfit'}}>{fmtIDR(inv.current_value)}</td>
          <td style={{textAlign:'right',fontFamily:'Outfit',fontWeight:600,color:gl>=0?'var(--acc)':'var(--red)'}}>{gl>=0?'+':''}{fmtIDR(gl)} <span style={{fontSize:'.73rem',fontWeight:400}}>({gl>=0?'+':''}{pct}%)</span></td>
          <td style={{color:'var(--t3)',fontSize:'.82rem'}}>{fmtDate(inv.purchase_date)}</td>

        </tr>
      );

      <div className="fg"><label>Tanggal Beli</label><input className="fi" type="date" value={f.purchase_date} onChange={function(e){uf('purchase_date',e.target.value);}}/></div>
    </div>
    <div className="fr">
      <div className="fg"><label>Modal (Rp)</label><input className="fi" type="number" placeholder="0" value={f.amount} onChange={function(e){uf('amount',e.target.value);}}/></div>
      <div className="fg"><label>Nilai Saat Ini (Rp)</label><input className="fi" type="number" placeholder="0" value={f.current_value} onChange={function(e){uf('current_value',e.target.value);}}/></div>
    </div>
  </Modal>
  {cEl}
</Fragment>
