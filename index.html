    var file=e.target.files[0];if(!file){return}

        var data=JSON.parse(ev.target.result);
        var ops=[];var counts={w:0,c:0,t:0,b:0,i:0};

        // Import wallets
        if(data.wallets&&data.wallets.length){data.wallets.forEach(function(w){
          ops.push(sb.from('wallets').insert({user_id:UID,name:w.name,balance:Number(w.balance)||0,color:w.color,group_type:w.group_type||'others'}).then(function(){counts.w++}))
        })}
        // Import categories (parents first, then children)
        if(data.categories&&data.categories.length){
          var catMap={};
          var parents=data.categories.filter(function(c){return !c.parent_id});
          var children=data.categories.filter(function(c){return !!c.parent_id});
          parents.forEach(function(c){
            ops.push(sb.from('categories').insert({user_id:UID,name:c.name,type:c.type||'expense',color:c.color,icon:c.icon||'📋'}).select().then(function(r){
              if(r.data&&r.data[0])catMap[c.id]=r.data[0].id;counts.c++
            }))
          });
          // Children need to wait for parents — simplified: add after a delay
          ops.push(new Promise(function(resolve){setTimeout(function(){
            var childOps=children.map(function(c){
              var pid=catMap[c.parent_id]||null;
              return sb.from('categories').insert({user_id:UID,name:c.name,type:c.type||'expense',color:c.color,icon:c.icon||'📋',parent_id:pid}).then(function(){counts.c++})
            });
            Promise.all(childOps).then(resolve)
          },2000)}))
        }

          ops.push(sb.from('budgets').insert({user_id:UID,category_id:null,amount:Number(b.amount)||0,period:b.period||'monthly',year:b.year||new Date().getFullYear(),month:b.month||new Date().getMonth()+1}).then(function(){counts.b++}))
        })}

          ops.push(sb.from('investments').insert({user_id:UID,name:inv.name,type:inv.type||'other',amount:Number(inv.amount)||0,current_value:Number(inv.current_value)||0,purchase_date:inv.purchase_date}).then(function(){counts.i++}))
        })}

        Promise.all(ops).then(function(){
          sImp(false);
          t('Import selesai: '+counts.w+' dompet, '+counts.c+' kategori, '+counts.b+' budget, '+counts.i+' investasi');
          rW();rC();rB();rI()
        }).catch(function(err){sImp(false);t('Error: '+err.message,'err')})
      }catch(err){sImp(false);t('File JSON tidak valid: '+err.message,'err')}
    };
    reader.readAsText(file);e.target.value=''
  }
