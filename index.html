<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}body{font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;outline:none}input,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}

/* ═══ THEME VARS ═══ */
[data-theme="dark"]{--bg:#0b0f1a;--bgc:#131a2b;--bgc2:#1a2236;--bgi:#0f1525;--brd:#1e293b;--acc:#10b981;--accd:#059669;--accbg:rgba(16,185,129,.08);--red:#ef4444;--redbg:rgba(239,68,68,.08);--org:#f59e0b;--blu:#3b82f6;--blubg:rgba(59,130,246,.08);--cyn:#06b6d4;--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--sbg:#0d1220;color-scheme:dark}
[data-theme="light"]{--bg:#f8fafc;--bgc:#ffffff;--bgc2:#f1f5f9;--bgi:#e2e8f0;--brd:#e2e8f0;--acc:#059669;--accd:#047857;--accbg:rgba(5,150,105,.08);--red:#dc2626;--redbg:rgba(220,38,38,.06);--org:#d97706;--blu:#2563eb;--blubg:rgba(37,99,235,.06);--cyn:#0891b2;--t1:#0f172a;--t2:#475569;--t3:#94a3b8;--sbg:#ffffff;color-scheme:light}
body{background:var(--bg);color:var(--t1)}
#root{display:flex;min-height:100vh;width:100%}

.sb{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--sbg);border-right:1px solid var(--brd);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sb-brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--acc),var(--cyn));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.sb-brand h1{font-size:1.15rem;font-weight:800}.sb-brand span{color:var(--acc)}
.sb-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.nv{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;color:var(--t2);font-size:.85rem;font-weight:500;transition:all .15s;background:transparent;width:100%;text-align:left}
.nv:hover{background:var(--bgc);color:var(--t1)}.nv.act{background:var(--accbg);color:var(--acc);font-weight:600}.nv svg{width:18px;height:18px;flex-shrink:0}
.sb-ft{padding:10px 16px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.theme-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:600;color:var(--t2);background:var(--bgi);transition:all .15s}
.theme-btn:hover{color:var(--t1)}

.main{margin-left:250px;flex:1;min-height:100vh;width:calc(100% - 250px)}
.pg{padding:28px 40px;width:100%}
.pg-hd{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pg-hd h2{font-size:1.4rem;font-weight:700}.pg-hd p{color:var(--t2);font-size:.82rem;margin-top:2px}

.cd{background:var(--bgc);border:1px solid var(--brd);border-radius:12px;padding:20px;transition:border-color .15s}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.st .lb{font-size:.75rem;color:var(--t2);margin-bottom:6px;font-weight:500}.st .vl{font-size:1.3rem;font-weight:700}.st .sub{font-size:.72rem;color:var(--t3);margin-top:3px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;transition:all .15s}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--accd)}.bs{background:var(--bgc);color:var(--t1);border:1px solid var(--brd)}.bd{background:var(--redbg);color:var(--red)}
button svg{width:18px;height:18px;flex-shrink:0}
.bi{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:transparent;color:var(--t2);border:none}.bi:hover{background:var(--bgc2);color:var(--t1)}

.fg{margin-bottom:14px}.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;padding:9px 12px;background:var(--bgi);border:1px solid var(--brd);border-radius:8px;color:var(--t1);font-size:16px;transition:border-color .15s}.fi:focus{border-color:var(--acc)}.fi::placeholder{color:var(--t3)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.moc{background:var(--bgc);border:1px solid var(--brd);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.moh{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}.moh h3{font-size:1.05rem;font-weight:700}
.mob{padding:16px 20px}.mof{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:.7rem;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--brd)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--brd);font-size:.84rem}tbody tr:hover{background:var(--bgc2)}

.tabs{display:flex;gap:2px;background:var(--bgi);border-radius:8px;padding:3px;width:fit-content}.tab{padding:6px 16px;border-radius:6px;font-size:.8rem;font-weight:600;color:var(--t3);background:transparent;transition:all .15s}.tab.act{background:var(--bgc);color:var(--acc)}

.tc{position:fixed;bottom:16px;right:16px;z-index:2000}.toast{padding:10px 16px;border-radius:8px;font-size:.82rem;font-weight:500;margin-top:6px}.tok{background:#065f46;color:#a7f3d0;border:1px solid #10b981}.terr{background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444}

.empty{text-align:center;padding:40px 16px;color:var(--t3)}.empty .ei{font-size:36px;margin-bottom:10px;opacity:.5}.empty h3{color:var(--t2);margin-bottom:4px;font-size:.95rem}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:500}
.bbg{width:100%;height:6px;background:var(--bgi);border-radius:3px;overflow:hidden;margin-top:6px}.bfill{height:100%;border-radius:3px;transition:width .4s}
.clr{display:flex;gap:6px;flex-wrap:wrap}.co{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s}.co.sel{border-color:var(--t1);transform:scale(1.15)}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.fbar .fi{max-width:170px}

.chat-box{display:flex;flex-direction:column}.chat-msgs{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px;max-height:55vh}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:10px;font-size:.84rem;line-height:1.6;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:3px}
.chat-msg.ai{align-self:flex-start;background:var(--bgc2);border:1px solid var(--brd);border-bottom-left-radius:3px}
.chat-msg.sys{align-self:center;color:var(--t3);font-size:.78rem;text-align:center;padding:6px}
.chat-input{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--brd)}

.mh{display:none;position:fixed;top:0;left:0;right:0;height:50px;background:var(--sbg);border-bottom:1px solid var(--brd);z-index:100;padding:0 12px;align-items:center;justify-content:space-between}
.mn{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--sbg);border-top:1px solid var(--brd);z-index:100;padding:0 2px;align-items:center;justify-content:space-around}
.mni{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.6rem;color:var(--t3);padding:4px 8px;border-radius:6px;background:transparent;border:none}.mni.act{color:var(--acc)}.mni svg{width:20px;height:20px}

.dg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.dg3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:10px}
.dg2b{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media(max-width:768px){
  .dg4{grid-template-columns:repeat(2,1fr);gap:8px}
  .dg3{grid-template-columns:1fr;gap:8px}
  .dg2b{grid-template-columns:1fr;gap:8px}
  .sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}.mh,.mn{display:flex}.main{margin-left:0;padding-bottom:70px;padding-top:50px}.pg{padding:14px 12px}.sg{grid-template-columns:repeat(2,1fr);gap:8px}.fr{grid-template-columns:1fr}.fbar .fi{max-width:100%;flex:1}.dg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.dg3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:10px}
.dg2w{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media(max-width:768px){.dg4{grid-template-columns:repeat(2,1fr)}.dg3,.dg2w{grid-template-columns:1fr}.dg4 .cd{padding:12px 14px !important}.dg3 .cd,.dg2w .cd{padding:14px 16px !important}}
}
.mn{overflow-x:visible;justify-content:space-around !important;gap:0;padding:0 !important}
.mni{min-width:60px;flex-shrink:0;padding:6px 8px !important;font-size:.6rem !important;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none}
.mni.act{color:var(--acc)}.mni svg{width:22px !important;height:22px !important}
.mni-fab{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;cursor:pointer;padding:0;min-width:60px;margin-top:-14px}
.fab-inner{width:52px;height:52px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.4);transition:background .15s}
.fab-inner.fab-act{background:var(--accd);box-shadow:0 4px 18px rgba(16,185,129,.6)}
.fab-inner svg{width:22px;height:22px}
.mni-fab span{font-size:.6rem;color:var(--acc);font-weight:600;margin-top:2px}
.fab{position:fixed;bottom:76px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(16,185,129,.4);z-index:90;border:none;transition:transform .15s}
.fab:hover{transform:scale(1.1)}
@media(min-width:769px){.fab{display:none}}
</style>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif"><div style="text-align:center"><div style="width:56px;height:56px;background:linear-gradient(135deg,#10b981,#06b6d4);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:800;color:#fff">W</div><div style="font-size:1.4rem;font-weight:800;color:#f1f5f9">Wealth<span style="color:#10b981">Flow</span></div><div style="color:#64748b;font-size:.82rem;margin-top:6px">Memuat...</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script>if(!window.React)document.write('<scr'+'ipt src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"><\/scr'+'ipt>')</script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>if(!window.ReactDOM)document.write('<scr'+'ipt src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"><\/scr'+'ipt>')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" crossorigin></script>
<script>if(!window.supabase)document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/scr'+'ipt>')</script>
<script>
if(!window.React||!window.ReactDOM||!window.supabase){document.getElementById('root').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#ef4444;padding:20px;text-align:center"><div>⚠️ Library gagal dimuat. Refresh halaman.</div></div>'}else{
var h=React.createElement,F=React.Fragment,useState=React.useState,useEffect=React.useEffect,useCallback=React.useCallback,useMemo=React.useMemo,createContext=React.createContext,useContext=React.useContext;
var UID=null; // Dynamic - set from auth session

/* ═══ AUTH PAGE ═══ */
function AuthPage(p){
  var _tab=useState('login'),tab=_tab[0],sTab=_tab[1];
  var _email=useState(''),email=_email[0],sEmail=_email[1];
  var _pass=useState(''),pass=_pass[0],sPass=_pass[1];
  var _newPass=useState(''),newPass=_newPass[0],sNewPass=_newPass[1];
  var _err=useState(''),err=_err[0],sErr=_err[1];
  var _ok=useState(''),ok=_ok[0],sOk=_ok[1];
  var _loading=useState(false),loading=_loading[0],sLoading=_loading[1];

  // Password reset redirect is now handled at App level via onAuthStateChange PASSWORD_RECOVERY event

  function doLogin(){
    if(!email||!pass){sErr('Email dan password wajib diisi');return}
    sLoading(true);sErr('');
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      sLoading(false);
      if(r.error){sErr(r.error.message);return}
      if(p.onAuth)p.onAuth(r.data.user);
    })
  }
  function doRegister(){
    if(!email||!pass){sErr('Email dan password wajib diisi');return}
    if(pass.length<6){sErr('Password minimal 6 karakter');return}
    sLoading(true);sErr('');
    sb.auth.signUp({email:email,password:pass}).then(function(r){
      sLoading(false);
      if(r.error){sErr(r.error.message);return}
      if(r.data.user&&!r.data.user.email_confirmed_at){sErr('');sTab('verify')}
      else if(p.onAuth)p.onAuth(r.data.user);
    })
  }
  function doForgot(){
    if(!email){sErr('Masukkan email kamu');return}
    sLoading(true);sErr('');sOk('');
    var url=window.location.origin+window.location.pathname;
    sb.auth.resetPasswordForEmail(email,{redirectTo:url}).then(function(r){
      sLoading(false);
      if(r.error){sErr(r.error.message);return}
      sOk('Link reset password dikirim ke '+email+'. Cek inbox & folder spam.');
    })
  }
  function doResetPassword(){
    if(!newPass||newPass.length<6){sErr('Password minimal 6 karakter');return}
    sLoading(true);sErr('');
    sb.auth.updateUser({password:newPass}).then(function(r){
      sLoading(false);
      if(r.error){sErr(r.error.message);return}
      sOk('Password berhasil diubah!');
      setTimeout(function(){sTab('login');sOk('');sNewPass('')},2000);
    })
  }

  // Logo header - reusable
  var Logo=h('div',{style:{textAlign:'center',marginBottom:32}},
    h('div',{style:{width:56,height:56,background:'linear-gradient(135deg,var(--acc),var(--cyn))',borderRadius:14,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:800,color:'#fff',marginBottom:12}},'W'),
    h('h1',{style:{fontSize:'1.6rem',fontWeight:800}},'Wealth',h('span',{style:{color:'var(--acc)'}},'Flow')),
    h('p',{style:{color:'var(--t3)',fontSize:'.85rem',marginTop:4}},'Personal Finance Manager'));

  var AlertBox=function(msg,type){return h('div',{style:{background:type==='ok'?'var(--accbg)':'var(--redbg)',border:'1px solid '+(type==='ok'?'var(--acc)':'var(--red)'),borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:'.82rem',color:type==='ok'?'var(--acc)':'var(--red)'}},msg)};

  // === VERIFY EMAIL ===
  if(tab==='verify')return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',width:'100%',padding:20}},
    h('div',{style:{maxWidth:400,width:'100%'}},Logo,
      h('div',{className:'cd',style:{padding:28,textAlign:'center'}},
        h('div',{style:{fontSize:48,marginBottom:16}},'📧'),
        h('h2',{style:{marginBottom:8}},'Cek Email Kamu'),
        h('p',{style:{color:'var(--t2)',marginBottom:8}},'Link verifikasi dikirim ke ',h('strong',null,email)),
        h('p',{style:{color:'var(--t3)',fontSize:'.82rem',marginBottom:16}},'Klik link di email, lalu kembali ke sini dan login.'),
        h('button',{className:'btn bp',style:{width:'100%',justifyContent:'center'},onClick:function(){sTab('login')}},'Ke Halaman Login'))));

  // === FORGOT PASSWORD ===
  if(tab==='forgot')return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',width:'100%',padding:20}},
    h('div',{style:{maxWidth:400,width:'100%'}},Logo,
      h('div',{className:'cd',style:{padding:28}},
        h('div',{style:{textAlign:'center',marginBottom:20}},
          h('div',{style:{fontSize:36,marginBottom:8}},'🔑'),
          h('h2',{style:{fontSize:'1.2rem',fontWeight:700}},'Lupa Password'),
          h('p',{style:{color:'var(--t3)',fontSize:'.82rem',marginTop:4}},'Masukkan email kamu. Kami kirim link untuk reset password.')),
        err?AlertBox(err,'err'):null,
        ok?AlertBox(ok,'ok'):null,
        h('div',{className:'fg'},h('label',null,'Email'),h('input',{className:'fi',type:'email',placeholder:'email@contoh.com',value:email,onChange:function(e){sEmail(e.target.value)},onKeyDown:function(e){if(e.key==='Enter')doForgot()},autoFocus:true})),
        h('button',{className:'btn bp',style:{width:'100%',justifyContent:'center',padding:'12px',fontSize:'.9rem',marginTop:4},onClick:doForgot,disabled:loading||!!ok},loading?'Mengirim...':ok?'Email Terkirim ✓':'Kirim Link Reset'),
        // Tips
        h('div',{style:{marginTop:16,padding:'12px 14px',background:'var(--bgi)',borderRadius:8,fontSize:'.75rem',color:'var(--t3)',lineHeight:1.6}},
          h('div',{style:{fontWeight:600,marginBottom:4,color:'var(--t2)'}},'📬 Email tidak masuk?'),
          h('div',null,'• Cek folder Spam / Junk'),
          h('div',null,'• Pengirim: noreply@mail.app.supabase.io'),
          h('div',null,'• Tunggu 1-2 menit'),
          h('div',null,'• Maksimal 2 email per jam'),
          h('div',{style:{marginTop:8,fontWeight:600,color:'var(--t2)'}},'💡 Alternatif:'),
          h('div',null,'Login dulu, lalu ubah password di Pengaturan → Akun')),
        h('button',{style:{width:'100%',marginTop:12,padding:'8px',background:'none',border:'none',color:'var(--acc)',cursor:'pointer',fontSize:'.82rem'},onClick:function(){sTab('login');sErr('');sOk('')}},'← Kembali ke Login'))));

  // === RESET PASSWORD (from email link) ===
  if(tab==='reset_password')return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',width:'100%',padding:20}},
    h('div',{style:{maxWidth:400,width:'100%'}},Logo,
      h('div',{className:'cd',style:{padding:28}},
        h('div',{style:{textAlign:'center',marginBottom:20}},
          h('div',{style:{fontSize:36,marginBottom:8}},'🔐'),
          h('h2',{style:{fontSize:'1.2rem',fontWeight:700}},'Buat Password Baru')),
        err?AlertBox(err,'err'):null,
        ok?AlertBox(ok,'ok'):null,
        h('div',{className:'fg'},h('label',null,'Password Baru'),h('input',{className:'fi',type:'password',placeholder:'Minimal 6 karakter',value:newPass,onChange:function(e){sNewPass(e.target.value)},onKeyDown:function(e){if(e.key==='Enter')doResetPassword()},autoFocus:true})),
        h('button',{className:'btn bp',style:{width:'100%',justifyContent:'center',padding:'12px',fontSize:'.9rem',marginTop:4},onClick:doResetPassword,disabled:loading||!!ok},loading?'Menyimpan...':'Simpan Password Baru'))));

  // === LOGIN / REGISTER ===
  return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',width:'100%',padding:20}},
    h('div',{style:{maxWidth:400,width:'100%'}},
      Logo,

/* ═══ TRANSFER MODAL ═══ */
function TransferMod(p){
  var W=p.W,rW=p.rW,rT=p.rT;var t=useContext(TCtx);
  var _f=useState({from:'',to:'',amount:'',desc:''}),f=_f[0],sF=_f[1];
  function ufx(k,v){var n={};for(var x in f)n[x]=f[x];n[k]=v;sF(n)}
  function save(){
    if(!UID){t('Sesi habis','err');return}
    if(!f.from||!f.to){t('Pilih dompet asal & tujuan','err');return}
    if(f.from===f.to){t('Dompet asal & tujuan harus beda','err');return}
    var amt=Number(f.amount);if(!amt||amt<=0){t('Jumlah > 0','err');return}
    var wFrom=fid(W,f.from);var wTo=fid(W,f.to);
    if(!wFrom||!wTo){t('Dompet tidak ditemukan','err');return}
    var desc=f.desc||('Transfer '+wn(W,f.from)+' → '+wn(W,f.to));
    var newBalFrom=(Number(wFrom.balance)||0)-amt;
    var newBalTo=(Number(wTo.balance)||0)+amt;

    // Step 1: Insert transfer_out transaction
    sb.from('transactions').insert({user_id:UID,date:td(),wallet_id:f.from,type:'transfer_out',amount:amt,description:desc})
    .then(function(r1){
      if(r1.error){t('Gagal catat transfer keluar: '+r1.error.message,'err');return}
      // Step 2: Insert transfer_in transaction
      sb.from('transactions').insert({user_id:UID,date:td(),wallet_id:f.to,type:'transfer_in',amount:amt,description:desc})
      .then(function(r2){
        if(r2.error){t('Gagal catat transfer masuk: '+r2.error.message,'err');return}
        // Step 3: Update source wallet balance
        sb.from('wallets').update({balance:newBalFrom}).eq('id',f.from)
        .then(function(r3){
          if(r3.error){t('Gagal update saldo asal: '+r3.error.message,'err');return}
          // Step 4: Update destination wallet balance
          sb.from('wallets').update({balance:newBalTo}).eq('id',f.to)
          .then(function(r4){
            if(r4.error){t('Gagal update saldo tujuan: '+r4.error.message,'err');return}
            // All 4 steps succeeded
            t('Transfer berhasil! '+fmt(amt)+' → '+wn(W,f.to));
            rW();rT();p.onClose();
          })
        })
      })

  var totalLiab=W.filter(function(w){return(Number(w.balance)||0)<0}).reduce(function(s,w){return s+(Number(w.balance)||0)},0)-debtLiab;
