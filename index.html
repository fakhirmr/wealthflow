.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){

const ToastCtx=createContext();
function ToastProvider({children}){

  </div></div>:null;
  return[confirm,el];

}

function InvestmentsPage({investments,rI}){
const toast=useToast();
const[modal,setM]=useState(null);
const[confirm,cEl]=useConfirm();
const[f,setF]=useState({name:’’,type:‘stock’,amount:’’,current_value:’’,purchase_date:today()});

const openA=()=>{setF({name:’’,type:‘stock’,amount:’’,current_value:’’,purchase_date:today()});setM({mode:‘add’});};
const openE=i=>{setF({name:i.name||’’,type:i.type||‘stock’,amount:String(i.amount||0),current_value:String(i.current_value||0),purchase_date:i.purchase_date||today()});setM({mode:‘edit’,d:i});};

const save=async()=>{
if(!f.name.trim()){toast(‘Nama wajib diisi’,‘err’);return;}
const p={name:f.name.trim(),type:f.type,amount:+f.amount||0,current_value:+f.current_value||0,purchase_date:f.purchase_date};
if(modal.mode===‘add’){const{error}=await sb.from(‘investments’).insert(p);if(error){toast(error.message,‘err’);return;}toast(‘Investasi ditambahkan’);}
else{const{error}=await sb.from(‘investments’).update(p).eq(‘id’,modal.d.id);if(error){toast(error.message,‘err’);return;}toast(‘Investasi diperbarui’);}
setM(null);rI();
};

const del=async i=>{
if(!await confirm(`Hapus investasi "${i.name}"?`))return;
const{error}=await sb.from(‘investments’).delete().eq(‘id’,i.id);
if(error){toast(error.message,‘err’);return;}
toast(‘Investasi dihapus’);rI();
};

const tI=investments.reduce((s,i)=>s+(+i.amount||0),0);
const tC=investments.reduce((s,i)=>s+(+i.current_value||+i.amount||0),0);
const tGL=tC-tI;

const typeLabel={stock:‘Saham’,crypto:‘Crypto’,mutual_fund:‘Reksa Dana’,bond:‘Obligasi’,gold:‘Emas’,property:‘Properti’,other:‘Lainnya’};

return<>
<div className="pg-hd"><div><h2>Investasi</h2><p>Pantau portofolio investasi Anda</p></div><button className="btn btn-p" onClick={openA}>{IC.plus} Tambah</button></div>
<div className="st-grid">
<div className="cd st"><div className="lb">Total Investasi</div><div className="vl">{fmtIDR(tI)}</div></div>
<div className="cd st"><div className="lb">Nilai Saat Ini</div><div className=“vl” style={{color:‘var(–blue)’}}>{fmtIDR(tC)}</div></div>
<div className="cd st"><div className="lb">Gain/Loss</div><div className="vl" style={{color:tGL>=0?‘var(–accent)’:‘var(–red)’}}>{tGL>=0?’+’:’’}{fmtIDR(tGL)}</div>{tI>0&&<div className="sub">{tGL>=0?’+’:’’}{((tGL/tI)*100).toFixed(1)}%</div>}</div>
</div>

```
{investments.length===0?<div className="cd"><div className="empty"><div className="ei">📈</div><h3>Belum Ada Investasi</h3><p>Mulai catat portofolio Anda</p></div></div>:
<div className="cd"><div className="tw"><table>
  <thead><tr><th>Nama</th><th>Tipe</th><th style={{textAlign:'right'}}>Modal</th><th style={{textAlign:'right'}}>Nilai Saat Ini</th><th style={{textAlign:'right'}}>G/L</th><th>Tanggal</th><th></th></tr></thead>
  <tbody>{investments.map(inv=>{
    const gl=(+inv.current_value||0)-(+inv.amount||0);const pct=inv.amount>0?((gl/inv.amount)*100).toFixed(1):0;
    return<tr key={inv.id}>
      <td style={{fontWeight:600}}>{inv.name}</td>
      <td><span className="tx-badge" style={{background:'rgba(59,130,246,.08)',color:'var(--blue)'}}>{typeLabel[inv.type]||inv.type||'-'}</span></td>
      <td style={{textAlign:'right',fontFamily:'Outfit'}}>{fmtIDR(inv.amount)}</td>
      <td style={{textAlign:'right',fontFamily:'Outfit'}}>{fmtIDR(inv.current_value)}</td>
      <td style={{textAlign:'right',fontFamily:'Outfit',fontWeight:600,color:gl>=0?'var(--accent)':'var(--red)'}}>{gl>=0?'+':''}{fmtIDR(gl)} <span style={{fontSize:'.73rem',fontWeight:400}}>({gl>=0?'+':''}{pct}%)</span></td>
      <td style={{color:'var(--t3)',fontSize:'.82rem'}}>{fmtDate(inv.purchase_date)}</td>
      <td style={{whiteSpace:'nowrap'}}><button className="btn-i" onClick={()=>openE(inv)}>{IC.edit}</button><button className="btn-i" onClick={()=>del(inv)} style={{color:'var(--red)'}}>{IC.trash}</button></td>
    </tr>;
  })}</tbody>
</table></div></div>}

<Modal open={!!modal} onClose={()=>setM(null)} title={modal?.mode==='add'?'Tambah Investasi':'Edit Investasi'} footer={<><button className="btn btn-s" onClick={()=>setM(null)}>Batal</button><button className="btn btn-p" onClick={save}>{modal?.mode==='add'?'Tambah':'Simpan'}</button></>}>
  <div className="fg"><label>Nama Aset</label><input className="fi" placeholder="cth: BBCA, Bitcoin, Emas..." value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></div>
  <div className="fr">
    <div className="fg"><label>Tipe</label><select className="fi" value={f.type} onChange={e=>setF({...f,type:e.target.value})}><option value="stock">Saham</option><option value="crypto">Crypto</option><option value="mutual_fund">Reksa Dana</option><option value="bond">Obligasi</option><option value="gold">Emas</option><option value="property">Properti</option><option value="other">Lainnya</option></select></div>
    <div className="fg"><label>Tanggal Beli</label><input className="fi" type="date" value={f.purchase_date} onChange={e=>setF({...f,purchase_date:e.target.value})}/></div>
  </div>
  <div className="fr">
    <div className="fg"><label>Modal (Rp)</label><input className="fi" type="number" placeholder="0" value={f.amount} onChange={e=>setF({...f,amount:e.target.value})}/></div>
    <div className="fg"><label>Nilai Saat Ini (Rp)</label><input className="fi" type="number" placeholder="0" value={f.current_value} onChange={e=>setF({...f,current_value:e.target.value})}/></div>
  </div>
</Modal>
{cEl}
```

</>;
}
